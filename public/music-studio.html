<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剪辑师音乐工作台</title>
<style>
/* ====== Reset & Variables — 网易云风格 ====== */
:root {
  --red: #ec4141;
  --red-hover: #c62f2f;
  --red-light: #fff0f0;
  --bg: #f5f5f5;
  --card: #fff;
  --sidebar-bg: #fafafa;
  --text: #333;
  --text2: #666;
  --text3: #999;
  --border: #e5e5e5;
  --radius: 4px;
  --radius-lg: 8px;
  --shadow: 0 1px 4px rgba(0,0,0,.06);
  --font: "Microsoft YaHei", "PingFang SC", -apple-system, sans-serif;
  --transition: .2s ease;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font: 13px var(--font);
  color: var(--text);
  background: var(--bg);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ====== Top Header ====== */
.topbar {
  height: 50px;
  background: linear-gradient(135deg, #ec4141 0%, #e03a3a 100%);
  display: flex;
  align-items: center;
  padding: 0 20px;
  flex-shrink: 0;
  z-index: 100;
}
.topbar .logo {
  font-size: 1.1rem;
  font-weight: 700;
  color: #fff;
  margin-right: 30px;
  white-space: nowrap;
  letter-spacing: .5px;
}
.topbar .logo span { font-weight: 400; opacity: .85; }

.topbar-nav { display: flex; gap: 2px; margin-right: auto; }
.nav-btn {
  padding: 6px 18px;
  border: none;
  border-radius: 4px 4px 0 0;
  background: transparent;
  color: rgba(255,255,255,.75);
  font-size: .85rem;
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
}
.nav-btn:hover { color: #fff; background: rgba(255,255,255,.1); }
.nav-btn.active { color: #ec4141; background: #fff; font-weight: 600; }
.nav-btn .badge {
  display: inline-block;
  background: rgba(255,255,255,.3);
  color: #fff;
  font-size: .65rem;
  padding: 0 5px;
  border-radius: 8px;
  margin-left: 4px;
  min-width: 16px;
  text-align: center;
}
.nav-btn.active .badge { background: var(--red); color: #fff; }

.topbar-actions { display:flex; gap:8px; align-items:center; }

/* ====== Layout ====== */
.main-wrap {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.sidebar {
  width: 200px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  padding: 12px 0;
}
.sidebar-section { padding: 8px 16px; }
.sidebar-title {
  font-size: .7rem;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.sidebar-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: .85rem;
  color: var(--text);
  transition: var(--transition);
  margin: 2px 0;
}
.sidebar-item:hover { background: #eee; }
.sidebar-item .count {
  margin-left: auto;
  font-size: .7rem;
  color: var(--text3);
}
.sidebar-divider { height: 1px; background: var(--border); margin: 8px 16px; }

.content {
  flex: 1;
  overflow-y: auto;
  padding: 16px 24px;
}

/* ====== Panels ====== */
.panel { display: none; }
.panel.active { display: flex; flex-direction: column; gap: 16px; }

.panel-title {
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--text);
  padding-bottom: 8px;
  border-bottom: 2px solid var(--red);
}

/* ====== Search ====== */
.search-bar {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.search-bar select {
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #fff;
  color: var(--text);
  font-size: .85rem;
  cursor: pointer;
  outline: none;
}
.search-bar select:focus { border-color: var(--red); }
.search-bar input {
  flex: 1;
  min-width: 200px;
  padding: 7px 12px;
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: .9rem;
  outline: none;
  background: #fff;
  transition: var(--transition);
}
.search-bar input:focus { border-color: var(--red); }
.search-bar .btn { border-radius: 20px; }

.btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 7px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #fff;
  color: var(--text);
  font-size: .85rem;
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
}
.btn:hover { background: #f0f0f0; }
.btn.accent { background: var(--red); color: #fff; border-color: var(--red); }
.btn.accent:hover { background: var(--red-hover); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-sm { padding: 4px 10px; font-size: .75rem; }

/* ====== Hot Tags ====== */
.hot-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.hot-tags span { font-size: .75rem; color: var(--text3); }
.hot-tags button {
  padding: 3px 10px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #fff;
  font-size: .75rem;
  color: var(--text2);
  cursor: pointer;
  transition: var(--transition);
}
.hot-tags button:hover { border-color: var(--red); color: var(--red); background: var(--red-light); }

/* ====== Track Row ====== */
.result-list { display: flex; flex-direction: column; }

.track-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  background: var(--card);
  border-radius: var(--radius);
  transition: var(--transition);
  cursor: default;
}
.track-row:nth-child(odd) { background: #fafafa; }
.track-row:hover { background: #f0f0f0; }
.track-row .idx { width: 28px; text-align: center; color: var(--text3); font-size: .8rem; flex-shrink: 0; }
.tr-cover {
  width: 44px; height: 44px;
  border-radius: 4px;
  object-fit: cover;
  background: #eee;
  flex-shrink: 0;
}
.tr-info { flex: 1; min-width: 0; }
.tr-title { font-size: .9rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr-artist { font-size: .75rem; color: var(--text3); margin-top: 2px; }
.tr-source {
  font-size: .6rem;
  color: var(--red);
  border: 1px solid var(--red);
  border-radius: 2px;
  padding: 0 4px;
  margin-left: 6px;
  vertical-align: middle;
}
.tr-actions { display: flex; gap: 6px; flex-shrink: 0; }
.tr-actions button {
  width: 30px; height: 30px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
  font-size: .8rem;
  transition: var(--transition);
  display: flex; align-items: center; justify-content: center;
}
.tr-actions button:hover { border-color: var(--red); background: var(--red-light); }

/* ====== Editor ====== */
.timeline-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.track-list { display: flex; flex-direction: column; gap: 10px; }
.track-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 12px;
}
.track-item-header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 8px;
}
.track-name { font-weight: 600; font-size: .85rem; flex: 1; }
.track-time { font-size: .7rem; color: var(--text3); font-family: monospace; }
.track-wave { background: #111; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
.track-wave canvas { display: block; width: 100%; }
.track-controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: .75rem; }
.track-controls label { color: var(--text3); white-space: nowrap; }
.track-controls input[type=range] { width: 80px; accent-color: var(--red); }
.trim-input { width: 58px; padding: 2px 4px; border: 1px solid var(--border); border-radius: 3px; font-size: .7rem; text-align: center; }

/* ====== Export ====== */
.export-card {
  background: var(--card);
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow);
  max-width: 500px;
}
.export-card .row {
  display: flex; align-items: center; gap: 12px;
  padding: 6px 0;
}
.export-card label { width: 60px; color: var(--text2); font-size: .85rem; }
.export-card select {
  padding: 5px 8px; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: .85rem; outline: none;
}
.export-progress {
  height: 6px; background: #eee; border-radius: 3px;
  margin-top: 8px; display: none; overflow: hidden;
}
.export-progress .fill {
  height: 100%; background: var(--red); width: 0;
  transition: width .3s;
}

/* ====== Empty State ====== */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text3); }
.empty-state .icon { font-size: 3rem; margin-bottom: 8px; }
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--red);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin: 0 auto 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ====== Player Bar (bottom) ====== */
.player-bar {
  height: 56px;
  background: #fff;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  flex-shrink: 0;
  box-shadow: 0 -2px 8px rgba(0,0,0,.04);
  z-index: 100;
}
.player-bar .np-cover {
  width: 40px; height: 40px;
  border-radius: 4px;
  object-fit: cover;
  background: #eee;
}
.player-bar .np-info { min-width: 120px; max-width: 200px; }
.player-bar .np-title { font-size: .85rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-bar .np-artist { font-size: .7rem; color: var(--text3); }
.player-bar .np-time { font-size: .75rem; color: var(--text3); margin: 0 8px; white-space: nowrap; }
.player-bar .progress-wrap {
  flex: 1; height: 6px;
  background: #eee; border-radius: 3px;
  cursor: pointer;
  position: relative;
}
.player-bar .progress-wrap .fill {
  height: 100%;
  background: var(--red);
  border-radius: 3px;
  width: 0;
  transition: width .05s linear;
}
.player-bar .controls { display: flex; gap: 8px; align-items: center; }
.player-bar input[type=range] { width: 80px; accent-color: var(--red); }

/* ====== Toast ====== */
.toast {
  position: fixed;
  bottom: 70px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #333;
  color: #fff;
  padding: 10px 24px;
  border-radius: 20px;
  font-size: .85rem;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: all .3s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ====== Danger ====== */
.btn.danger { color: var(--red); border-color: var(--red); }
.btn.danger:hover { background: var(--red); color: #fff; }

/* ====== Responsive ====== */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .topbar-nav .nav-btn { padding: 4px 10px; font-size: .75rem; }
  .search-bar { flex-direction: column; }
  .search-bar input { width: 100%; }
  .track-row { flex-wrap: wrap; }
}
</style>
</head>
<body>

<!-- ====== Topbar ====== -->
<div class="topbar">
  <div class="logo">🎬 音乐<span>工作台</span></div>
  <div class="topbar-nav">
    <button class="nav-btn active" data-panel="search">🔍 搜索</button>
    <button class="nav-btn" data-panel="fav">⭐ 收藏 <span class="badge" id="favCount">0</span></button>
    <button class="nav-btn" data-panel="editor">✂️ 剪辑 <span class="badge" id="trackCount">0</span></button>
    <button class="nav-btn" data-panel="export">📦 导出</button>
  </div>
</div>

<!-- ====== Main ====== -->
<div class="main-wrap">

  <!-- SEARCH Panel -->
  <div class="content">
    <div class="panel active" id="panel-search">
      <div class="search-bar">
        <select id="searchSource">
          <option value="tx">🎵 QQ音乐</option>
          <option value="kg">🎤 酷狗音乐</option>
        </select>
        <select id="searchQuality">
          <option value="128k">128k 快速</option>
          <option value="320k">320k 高音质</option>
        </select>
        <input type="text" id="searchInput" placeholder="搜索歌曲、歌手…" autocomplete="off">
        <button class="btn accent" id="btnSearch">🔍 搜索</button>
      </div>

      <div id="hotSection">
        <div class="hot-tags">
          <span>🔥</span>
          <div id="hotTracks" style="display:flex;flex-wrap:wrap;gap:6px"></div>
        </div>
      </div>

      <div class="result-list" id="searchResults">
        <div class="empty-state"><div class="icon">🔍</div><p>输入关键词开始搜索</p></div>
      </div>
    </div>

    <!-- FAV Panel -->
    <div class="panel" id="panel-fav">
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="btn accent btn-sm" id="btnFavToEditor">📥 全部加入编辑器</button>
        <button class="btn danger btn-sm" id="btnClearFavs">🗑️ 清空收藏</button>
      </div>
      <div class="result-list" id="favList">
        <div class="empty-state"><div class="icon">⭐</div><p>暂无收藏</p></div>
      </div>
    </div>

    <!-- EDITOR Panel -->
    <div class="panel" id="panel-editor">
      <div class="timeline-toolbar">
        <button class="btn accent" id="btnPlayMix">▶️ 预览混音</button>
        <button class="btn" id="btnStopMix">⏹️ 停止</button>
        <span style="font-size:.8rem;color:var(--text3);font-family:monospace" id="mixTimeDisplay">0:00.00</span>
        <button class="btn danger btn-sm" id="btnClearTracks" style="margin-left:auto">🗑️ 清空轨道</button>
      </div>
      <div class="track-list" id="trackList">
        <div class="empty-state"><div class="icon">✂️</div><p>暂无音频轨道</p></div>
      </div>
    </div>

    <!-- EXPORT Panel -->
    <div class="panel" id="panel-export">
      <div class="panel-title">📦 导出成品音乐</div>
      <div class="export-card">
        <div class="row"><label>格式</label>
          <select id="exportFormat"><option value="wav">WAV 无损</option><option value="mp3">MP3</option></select>
        </div>
        <div class="row"><label>采样率</label>
          <select id="exportSampleRate"><option value="44100">44100 Hz</option><option value="48000">48000 Hz</option></select>
        </div>
        <div class="row"><label>轨道数</label>
          <span id="exportTrackInfo" style="color:var(--text2)">0 个轨道</span>
        </div>
        <button class="btn accent btn-sm" id="btnExport" disabled style="margin-top:8px">🎧 开始导出</button>
        <div class="export-progress" id="exportProgress"><div class="fill"></div></div>
        <div style="font-size:.75rem;color:var(--text3);margin-top:6px" id="exportStatus"></div>
      </div>
      <div style="margin-top:16px">
        <div style="font-size:.8rem;color:var(--text3);margin-bottom:8px">📋 导出历史</div>
        <div id="exportHistory" style="font-size:.75rem;color:var(--text3)"></div>
      </div>
    </div>
  </div>
</div>

<!-- ====== Player Bar ====== -->
<div class="player-bar" id="playerBar">
  <img class="np-cover" id="npCover" src="" alt="">
  <div class="np-info">
    <div class="np-title" id="npTitle">未在播放</div>
    <div class="np-artist" id="npArtist">选择一首歌曲开始</div>
  </div>
  <span class="np-time" id="npTime">0:00</span>
  <div class="progress-wrap" id="playerProgressWrap">
    <div class="fill" id="playerProgressFill"></div>
  </div>
  <div class="controls">
    <button class="btn btn-sm accent" id="btnPlayPause">▶️</button>
    <span style="font-size:.7rem">🔊</span>
    <input type="range" id="volumeSlider" min="0" max="100" value="70">
  </div>
</div>

<!-- ====== Toast ====== -->
<div class="toast" id="toast"></div>

<script>
// ====== State ======
let favorites = JSON.parse(localStorage.getItem('ms_favorites') || '[]');
let editorTracks = [];
let currentTrack = null;
let audioCtx = null;
let currentSource = null;
let mixSources = [];
let isMixPlaying = false;
let mixStartTime = 0;
let mixTimer = null;

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

// ====== Nav Tabs ======
$$('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const name = btn.dataset.panel;
    $$('.panel').forEach(p => p.classList.remove('active'));
    const panel = document.getElementById('panel-' + name);
    if (panel) panel.classList.add('active');
    if (name === 'editor') { editorTracks.forEach((_, i) => drawWaveform(i)); }
    if (name === 'export') updateExportInfo();
  });
});

// ====== UTILS ======
function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2,'0')}`;
}
function fmtTimeMs(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  const ms = Math.floor((sec % 1) * 100);
  return `${m}:${String(s).padStart(2,'0')}.${String(ms).padStart(2,'0')}`;
}
let toastTimer;
function showToast(msg) {
  clearTimeout(toastTimer);
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ====== Audio Context ======
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// ====== API: QQ Music Search ======
async function searchQQMusic(query, page = 1) {
  const resp = await fetch('/api/music-search', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ source: 'tx', query, page })
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error || `HTTP ${resp.status}`);
  }
  const data = await resp.json();
  const list = data.req_1?.data?.body?.song?.list || [];
  return list.map(item => ({
    id: item.id || item.songid,
    songmid: item.mid || item.songmid,
    title: item.title || item.songname || item.name,
    artist: (item.singer || []).map(s => s.name).join(', '),
    album: item.album?.title || item.albumname || '',
    cover: item.album?.mid
      ? `https://y.gtimg.cn/music/photo_new/T002R300x300M000${item.album.mid}.jpg`
      : (item.albummid ? `https://y.gtimg.cn/music/photo_new/T002R300x300M000${item.albummid}.jpg` : ''),
    duration: item.interval || item.duration || 0,
    source: 'tx',
  }));
}

// ====== API: Kugou Search ======
async function searchKugou(query, page = 1) {
  const resp = await fetch('/api/music-search', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ source: 'kg', query, page })
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error || `HTTP ${resp.status}`);
  }
  const data = await resp.json();
  const list = data?.data?.lists || [];
  return list.map(item => ({
    id: item.FileHash || item.Grp?.[0]?.FileHash || '',
    songmid: item.FileHash || item.Grp?.[0]?.FileHash || '',
    hash: item.FileHash || item.Grp?.[0]?.FileHash || '',
    title: item.SongName || item.OriSongName || '',
    artist: item.SingerName || item.Singers?.[0]?.name || '',
    album: item.AlbumName || item.Grp?.[0]?.AlbumName || '',
    cover: (item.Image || item.Grp?.[0]?.Image || '').replace('{size}', '400'),
    duration: item.Duration || 0,
    source: 'kg',
  }));
}

// ====== API: Audio URL ======
const SOURCE_MAP = {
  tx: { name: 'QQ音乐', urlPrefix: 'tx' },
  kg: { name: '酷狗音乐', urlPrefix: 'kg' },
  kw: { name: '酷我音乐', urlPrefix: 'kw' },
  wy: { name: '网易云音乐', urlPrefix: 'wy' },
  mg: { name: '咪咕音乐', urlPrefix: 'mg' },
};

async function getAudioUrl(track, quality) {
  const src = track.source || 'tx';
  const prefix = SOURCE_MAP[src]?.urlPrefix || 'tx';
  const songId = track.songmid || track.id || track.hash || '';
  const q = quality || $('#searchQuality')?.value || '128k';
  const resp = await fetch(`/api/music-url?source=${prefix}&songId=${encodeURIComponent(songId)}&quality=${q}`);
  const data = await resp.json();
  if (!resp.ok || data.error) throw new Error(data.error || `HTTP ${resp.status}`);
  if (!data.url) throw new Error('未获取到播放地址');
  return data.url;
}

async function fetchAudioBuffer(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const arrayBuf = await resp.arrayBuffer();
  const ctx = getAudioCtx();
  return await ctx.decodeAudioData(arrayBuf);
}

// ====== Player ======
let playerBuffer = null;
let playerStartTime = 0;
let playerOffset = 0;
let playerAnimFrame = null;

function stopPlayer() {
  if (currentSource) {
    try { currentSource.stop(); } catch(e) {}
    currentSource = null;
  }
  cancelAnimationFrame(playerAnimFrame);
  playerAnimFrame = null;
  playerBuffer = null;
  $('#btnPlayPause').textContent = '▶️';
  $('#playerProgressFill').style.width = '0%';
  $('#npTime').textContent = '0:00';
}

async function playTrackUrl(trackInfo, url) {
  stopPlayer();
  try {
    playerBuffer = await fetchAudioBuffer(url);
    playBuffer(trackInfo);
  } catch(e) {
    showToast('❌ 播放失败: ' + e.message);
    console.error(e);
  }
}

function playBuffer(trackInfo) {
  const ctx = getAudioCtx();
  const source = ctx.createBufferSource();
  source.buffer = playerBuffer;
  const gainNode = ctx.createGain();
  gainNode.gain.value = $('#volumeSlider').value / 100;
  source.connect(gainNode);
  gainNode.connect(ctx.destination);
  source.start(0, playerOffset);
  currentSource = { source, gainNode, buffer: playerBuffer };
  playerStartTime = ctx.currentTime - playerOffset;
  $('#btnPlayPause').textContent = '⏸️';
  if (trackInfo) {
    currentTrack = trackInfo;
    $('#npCover').src = trackInfo.cover || '';
    $('#npTitle').textContent = trackInfo.title;
    $('#npArtist').textContent = trackInfo.artist;
  }
  updatePlayerProgress();
  source.onended = () => {
    playerOffset = 0;
    stopPlayer();
  };
}

function updatePlayerProgress() {
  if (!currentSource || !currentSource.buffer) return;
  const ctx = getAudioCtx();
  const elapsed = ctx.currentTime - playerStartTime;
  const dur = currentSource.buffer.duration;
  const pct = Math.min(100, (elapsed / dur) * 100);
  $('#playerProgressFill').style.width = pct + '%';
  $('#npTime').textContent = fmtTime(elapsed);
  playerAnimFrame = requestAnimationFrame(updatePlayerProgress);
}

function togglePlayer() {
  if (!currentTrack) return;
  if (currentSource) {
    playerOffset = getAudioCtx().currentTime - playerStartTime;
    stopPlayer();
  } else if (playerBuffer && currentTrack) {
    playBuffer(currentTrack);
  }
}

$('#btnPlayPause').addEventListener('click', togglePlayer);
$('#playerProgressWrap').addEventListener('click', (e) => {
  if (!playerBuffer) return;
  const rect = $('#playerProgressWrap').getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  playerOffset = pct * playerBuffer.duration;
  if (currentSource) { stopPlayer(); currentSource = null; }
  playBuffer(currentTrack);
});
$('#volumeSlider').addEventListener('input', () => {
  if (currentSource) currentSource.gainNode.gain.value = $('#volumeSlider').value / 100;
});

function renderEditorTracks() {
  const container = $('#trackList');
  if (editorTracks.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">✂️</div><p>暂无音频轨道</p><p style="font-size:.75rem;color:var(--text3)">从搜索或收藏中添加歌曲</p></div>';

  container.innerHTML = editorTracks.map((t, i) => `
    <div class="track-item" data-idx="${i}">
      <div class="track-item-header">
        <span>🎵</span>
        <span class="track-name">${escapeHtml(t.title)} — ${escapeHtml(t.artist)}</span>
        <span class="track-time">${fmtTimeMs(t.trimStart)} → ${fmtTimeMs(t.trimEnd)} (${fmtTimeMs(t.trimEnd - t.trimStart)})</span>
        <button data-action="remove-track" data-idx="${i}" title="移除" style="border:none;background:none;cursor:pointer;font-size:1rem;color:var(--text3)">✕</button>
      </div>
      <div class="track-wave"><canvas id="waveCanvas${i}"></canvas></div>
      <div class="track-controls">
        <label>🔊</label>
        <input type="range" min="0" max="200" value="${t.volume}" data-action="vol" data-idx="${i}">
        <span style="font-size:.7rem">${t.volume}%</span>
        <label>✂️ 起始</label>
        <input type="number" class="trim-input" value="${t.trimStart.toFixed(2)}" step="0.1" min="0" max="${t.duration.toFixed(2)}" data-action="trimStart" data-idx="${i}">
        <label>结束</label>
        <input type="number" class="trim-input" value="${t.trimEnd.toFixed(2)}" step="0.1" min="0" max="${t.duration.toFixed(2)}" data-action="trimEnd" data-idx="${i}">
        <label>⏱ 偏移</label>
        <input type="number" class="trim-input" value="${t.offset.toFixed(2)}" step="0.1" min="0" data-action="offset" data-idx="${i}">
      </div>
    </div>
  `).join('');

  editorTracks.forEach((t, i) => drawWaveform(i));

  container.querySelectorAll('[data-action="remove-track"]').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); removeTrackFromEditor(parseInt(btn.dataset.idx)); });
  });
  container.querySelectorAll('[data-action="vol"]').forEach(slider => {
    slider.addEventListener('input', () => {
      const i = parseInt(slider.dataset.idx);
      editorTracks[i].volume = parseInt(slider.value);
      slider.nextElementSibling.textContent = slider.value + '%';
    });
  });
  container.querySelectorAll('[data-action="trimStart"],[data-action="trimEnd"]').forEach(inp => {
    inp.addEventListener('change', () => {
      const i = parseInt(inp.dataset.idx);
      const t = editorTracks[i];
      if (inp.dataset.action === 'trimStart') t.trimStart = Math.max(0, parseFloat(inp.value) || 0);
      else t.trimEnd = Math.min(t.duration, parseFloat(inp.value) || t.duration);
      inp.value = (inp.dataset.action === 'trimStart' ? t.trimStart : t.trimEnd).toFixed(2);
      renderEditorTracks();
    });
  });
  container.querySelectorAll('[data-action="offset"]').forEach(inp => {
    inp.addEventListener('change', () => {
      const i = parseInt(inp.dataset.idx);
      editorTracks[i].offset = Math.max(0, parseFloat(inp.value) || 0);
      inp.value = editorTracks[i].offset.toFixed(2);
    });
  });
}

function drawWaveform(idx) {
  const t = editorTracks[idx];
  const canvas = document.getElementById('waveCanvas' + idx);
  if (!canvas || !t.buffer) return;
  const container = canvas.parentElement;
  canvas.width = container.clientWidth;
  canvas.height = 60;
  const ctx = canvas.getContext('2d');
  const data = t.buffer.getChannelData(0);
  const width = canvas.width, height = canvas.height;
  const step = Math.ceil(data.length / width);
  const trimSX = (t.trimStart / t.duration) * width;
  const trimEX = (t.trimEnd / t.duration) * width;
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = '#e8e8e8';
  ctx.fillRect(0, 0, width, height);
  ctx.fillStyle = '#d4e8d4';
  ctx.fillRect(trimSX, 0, trimEX - trimSX, height);
  ctx.beginPath();
  ctx.strokeStyle = '#ec4141';
  ctx.lineWidth = 1;
  for (let x = 0; x < width; x++) {
    let min = 1, max = -1;
    const start = Math.floor(x * step);
    const end = Math.floor((x + 1) * step);
    for (let j = start; j < end; j++) {
      const v = data[j] || 0;
      if (v < min) min = v;
      if (v > max) max = v;
    }
    ctx.moveTo(x, (1 - max) * height / 2);
    ctx.lineTo(x, (1 - min) * height / 2);
  }
  ctx.stroke();
  ctx.strokeStyle = '#999';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(trimSX, 0); ctx.lineTo(trimSX, height); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(trimEX, 0); ctx.lineTo(trimEX, height); ctx.stroke();
}

// ====== Mix Preview ======
function stopMixPlayback() {
  mixSources.forEach(s => { try { s.source.stop(); } catch(e) {} });
  mixSources = [];
  isMixPlaying = false;
  clearInterval(mixTimer);
  mixTimer = null;
  $('#mixTimeDisplay').textContent = '0:00.00';
  $('#btnPlayMix').textContent = '▶️ 预览混音';
}

$('#btnPlayMix').addEventListener('click', () => {
  if (editorTracks.length === 0) { showToast('请先添加音频轨道'); return; }
  if (isMixPlaying) { stopMixPlayback(); return; }
  const ctx = getAudioCtx();
  const totalDuration = editorTracks.reduce((max, t) =>
    Math.max(max, (t.offset || 0) + (t.trimEnd - t.trimStart)), 0);
  mixSources = [];
  editorTracks.forEach(t => {
    const source = ctx.createBufferSource();
    source.buffer = t.buffer;
    const gainNode = ctx.createGain();
    gainNode.gain.value = t.volume / 100;
    source.connect(gainNode);
    gainNode.connect(ctx.destination);
    source.start(ctx.currentTime + (t.offset || 0), t.trimStart, t.trimEnd - t.trimStart);
    mixSources.push({ source, gainNode });
  });
  isMixPlaying = true;
  mixStartTime = ctx.currentTime;
  $('#btnPlayMix').textContent = '⏸️ 暂停';
  mixTimer = setInterval(() => {
    const elapsed = ctx.currentTime - mixStartTime;
    $('#mixTimeDisplay').textContent = fmtTimeMs(elapsed);
    if (elapsed >= totalDuration) stopMixPlayback();
  }, 100);
});

$('#btnStopMix').addEventListener('click', stopMixPlayback);

$('#btnClearTracks').addEventListener('click', () => {
  if (editorTracks.length === 0) return;
  if (confirm(`确定清空全部 ${editorTracks.length} 条轨道吗？`)) {
    stopMixPlayback();
    editorTracks = [];
    renderEditorTracks();
    updateTrackCount();
    updateExportInfo();

});

let exportHistoryItems = JSON.parse(localStorage.getItem('ms_export_history') || '[]');

function addExportHistory(name, format) {
  exportHistoryItems.unshift({ name, format, time: new Date().toLocaleString() });
  if (exportHistoryItems.length > 20) exportHistoryItems.length = 20;
  localStorage.setItem('ms_export_history', JSON.stringify(exportHistoryItems));
  renderExportHistory();

function renderExportHistory() {
  const container = $('#exportHistory');
  if (!container) return;
  if (exportHistoryItems.length === 0) {
    container.innerHTML = '<span>暂无导出记录</span>';
    return;
  }
  container.innerHTML = exportHistoryItems.map(h =>
    `<div style="padding:4px 0;border-bottom:1px solid var(--border)">📁 ${h.name} (${h.format.toUpperCase()}) · ${h.time}</div>`
  ).join('');

$('#btnExport').addEventListener('click', async () => {
  if (editorTracks.length === 0) return;
  const format = $('#exportFormat').value;
  const sampleRate = parseInt($('#exportSampleRate').value);
  const btn = $('#btnExport');
  btn.disabled = true; btn.textContent = '⏳ 导出中…';
  const progress = $('#exportProgress');
  const progressFill = progress.querySelector('.fill');
  progress.style.display = 'block';
  progressFill.style.width = '0%';
  const status = $('#exportStatus');
  status.textContent = '准备中…';

  try {
    const totalDuration = editorTracks.reduce((max, t) =>
      Math.max(max, (t.offset || 0) + (t.trimEnd - t.trimStart)), 0);
    if (totalDuration <= 0) throw new Error('无效时长');
    const offlineCtx = new OfflineAudioContext(2, Math.ceil(sampleRate * totalDuration), sampleRate);
    for (const t of editorTracks) {
      const trimDur = t.trimEnd - t.trimStart;
      if (trimDur <= 0) continue;
      const source = offlineCtx.createBufferSource();
      source.buffer = t.buffer;
      const gain = offlineCtx.createGain();
      gain.gain.value = t.volume / 100;
      source.connect(gain);
      gain.connect(offlineCtx.destination);
      source.start(t.offset || 0, t.trimStart, trimDur);
    }
    status.textContent = '渲染中…';
    progressFill.style.width = '30%';
    const rendered = await offlineCtx.startRendering();
    progressFill.style.width = '70%';
    status.textContent = '编码中…';
    const blob = encodeWAV(rendered, sampleRate);
    progressFill.style.width = '100%';
    status.textContent = '✅ 完成';
    const filename = `mixdown_${Date.now()}.wav`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
    addExportHistory(filename, 'wav');
    showToast('✅ 导出成功: ' + filename);
  } catch(err) {
    status.textContent = '❌ ' + err.message;
    showToast('❌ 导出失败: ' + err.message);
  } finally {
    btn.disabled = editorTracks.length === 0;
    btn.textContent = '🎧 开始导出';
    setTimeout(() => { progress.style.display = 'none'; progressFill.style.width = '0%'; status.textContent = ''; }, 3000);
  }
});

function encodeWAV(audioBuffer, sampleRate) {
  const numChannels = audioBuffer.numberOfChannels;
  const length = audioBuffer.length;
  const buffer = new ArrayBuffer(44 + length * numChannels * 2);
  const view = new DataView(buffer);
  const writeStr = (v, off, str) => { for (let i = 0; i < str.length; i++) v.setUint8(off + i, str.charCodeAt(i)); };
  writeStr(view, 0, 'RIFF');
  view.setUint32(4, 36 + length * numChannels * 2, true);
  writeStr(view, 8, 'WAVE');
  writeStr(view, 12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * numChannels * 2, true);
  view.setUint16(32, numChannels * 2, true);
  view.setUint16(34, 16, true);
  writeStr(view, 36, 'data');
  view.setUint32(40, length * numChannels * 2, true);
  let offset = 44;
  for (let i = 0; i < length; i++) {
    for (let ch = 0; ch < numChannels; ch++) {
      const sample = Math.max(-1, Math.min(1, audioBuffer.getChannelData(ch)[i]));
      view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
      offset += 2;
    }
  }
  return new Blob([buffer], { type: 'audio/wav' });
}

const HOT_TAGS = ['周杰伦','林俊杰','陈奕迅','邓紫棋','Taylor Swift','纯音乐','电子','古风','说唱','民谣'];
function renderHotTags() {
  const container = $('#hotTracks');
  if (!container) return;
  container.innerHTML = HOT_TAGS.map(tag =>
    `<button data-tag="${tag}">${tag}</button>`
  ).join('');
  container.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      $('#searchInput').value = btn.dataset.tag;
      doSearch();
    });
  });
}
