<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频分镜工具 — Storyboard</title>
<style>
/* ====== CSS Variables & Reset ====== */
:root {
  --bg: #1a1a2e;
  --panel-bg: #16213e;
  --card-bg: #0f3460;
  --accent: #e94560;
  --accent-hover: #ff6b81;
  --text: #eaeaea;
  --text-dim: #8899aa;
  --border: #2a3a5c;
  --radius: 10px;
  --gap: 12px;
  --transition: 0.2s ease;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ====== Toolbar ====== */
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  background: var(--panel-bg);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  flex-wrap: wrap;
}
.toolbar h1 {
  font-size: 1.15rem;
  font-weight: 700;
  margin-right: auto;
  white-space: nowrap;
  letter-spacing: 0.5px;
}
.toolbar h1 span { color: var(--accent); }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--card-bg);
  color: var(--text);
  font-size: 0.875rem;
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
  user-select: none;
}
.btn:hover { background: var(--border); border-color: var(--accent); }
.btn:active { transform: scale(0.97); }
.btn.accent {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}
.btn.accent:hover { background: var(--accent-hover); }
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}

.shot-count {
  font-size: 0.8rem;
  color: var(--text-dim);
  padding: 4px 10px;
  background: var(--bg);
  border-radius: 20px;
}

/* ====== Main Layout ====== */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
  gap: 2px;
  background: var(--border);
}

/* ====== Video Panel ====== */
.video-panel {
  flex: 1 1 50%;
  display: flex;
  flex-direction: column;
  background: var(--panel-bg);
  min-width: 360px;
}

.video-drop-zone {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: #000;
  cursor: pointer;
}
.video-drop-zone.empty::after {
  content: "拖拽视频到此处，或点击选择文件";
  color: var(--text-dim);
  font-size: 1rem;
  pointer-events: none;
  text-align: center;
  padding: 20px;
}
.video-drop-zone video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: none;
}
.video-drop-zone.has-video video { display: block; }
.video-drop-zone.has-video.empty::after { display: none; }

/* ====== Video Controls ====== */
.video-controls {
  padding: 10px 14px;
  background: var(--card-bg);
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ctrl-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.ctrl-row .time {
  font-size: 0.8rem;
  font-variant-numeric: tabular-nums;
  color: var(--text-dim);
  min-width: 100px;
  text-align: center;
}
.ctrl-row .time .current { color: var(--text); font-weight: 600; }

.progress-bar {
  flex: 1;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  cursor: pointer;
  position: relative;
  min-width: 80px;
}
.progress-bar .fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  width: 0%;
  transition: width 0.05s linear;
  pointer-events: none;
}

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  font-size: 1rem;
  cursor: pointer;
  transition: var(--transition);
  flex-shrink: 0;
}
.icon-btn:hover { background: var(--border); border-color: var(--accent); }
.icon-btn:active { transform: scale(0.93); }

/* ====== Storyboard Panel ====== */
.storyboard-panel {
  flex: 1 1 50%;
  display: flex;
  flex-direction: column;
  background: var(--panel-bg);
  min-width: 340px;
}
.storyboard-header {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 0.9rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.storyboard-header .hint {
  font-weight: 400;
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-left: auto;
}
.storyboard-grid {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: var(--gap);
  align-content: start;
}
.storyboard-grid:empty::after {
  content: "点击 📸 截图按钮捕获当前帧\A或按快捷键 Space 暂停后按 S 截图";
  white-space: pre;
  color: var(--text-dim);
  font-size: 0.85rem;
  text-align: center;
  grid-column: 1 / -1;
  padding: 40px 20px;
}

/* ====== Shot Card ====== */
.shot-card {
  background: var(--card-bg);
  border: 2px solid transparent;
  border-radius: var(--radius);
  overflow: hidden;
  cursor: grab;
  transition: var(--transition);
  display: flex;
  flex-direction: column;
}
.shot-card:hover { border-color: var(--accent); }
.shot-card:active { cursor: grabbing; }
.shot-card.dragging { opacity: 0.4; border-color: var(--accent); }
.shot-card.drag-over { border-color: var(--accent-hover); border-style: dashed; }

.shot-card .thumb-wrap {
  position: relative;
  aspect-ratio: 16/9;
  background: #000;
  overflow: hidden;
}
.shot-card .thumb-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.shot-card .shot-num {
  position: absolute;
  top: 6px;
  left: 6px;
  background: var(--accent);
  color: #fff;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
}
.shot-card .shot-del {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 24px; height: 24px;
  border-radius: 50%;
  border: none;
  background: rgba(0,0,0,0.6);
  color: #fff;
  font-size: 0.85rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: var(--transition);
}
.shot-card:hover .shot-del { opacity: 1; }
.shot-card .shot-del:hover { background: var(--accent); }

.shot-card .card-info {
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.shot-card .timecode {
  font-size: 0.7rem;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}
.shot-card .note-input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--bg);
  color: var(--text);
  font-size: 0.78rem;
  padding: 5px 7px;
  resize: none;
  font-family: inherit;
  min-height: 36px;
}
.shot-card .note-input:focus {
  outline: none;
  border-color: var(--accent);
}
.shot-card .note-input::placeholder {
  color: var(--text-dim);
  font-size: 0.7rem;
}

/* ====== Scrollbar ====== */
.storyboard-grid::-webkit-scrollbar { width: 6px; }
.storyboard-grid::-webkit-scrollbar-track { background: transparent; }
.storyboard-grid::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 3px;
}

/* ====== Responsive ====== */
@media (max-width: 768px) {
  .main { flex-direction: column; }
  .video-panel { min-width: 0; flex: 1 1 45%; }
  .storyboard-panel { min-width: 0; flex: 1 1 55%; }
  .storyboard-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
}

/* ====== Drop overlay ====== */
.drop-overlay {
  position: fixed;
  inset: 0;
  background: rgba(233,69,96,0.15);
  border: 4px dashed var(--accent);
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--accent);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
}
.drop-overlay.active { opacity: 1; }
</style>
</head>
<body>

<!-- ====== Drop Overlay ====== -->
<div class="drop-overlay" id="dropOverlay">释放以加载视频</div>

<!-- ====== Toolbar ====== -->
<div class="toolbar">
  <h1>🎬 <span>分镜</span>工具</h1>
  <label class="btn" id="btnLoad" title="选择视频文件 (Ctrl+O)">
    📂 加载视频
    <input type="file" id="fileInput" accept="video/*" hidden>
  </label>
  <button class="btn" id="btnClear" disabled title="清空所有分镜">🗑️ 清空</button>
  <button class="btn accent" id="btnExport" disabled title="导出分镜长图 (Ctrl+E)">📥 导出 PNG</button>
  <span class="shot-count" id="shotCount">0 个镜头</span>
</div>

<!-- ====== Main ====== -->
<div class="main">

  <!-- Video Panel -->
  <div class="video-panel" id="videoPanel">
    <div class="video-drop-zone empty" id="dropZone">
      <video id="video" preload="metadata" crossorigin="anonymous"></video>
    </div>
    <div class="video-controls" id="videoControls">
      <!-- row 1: playback -->
      <div class="ctrl-row">
        <button class="icon-btn" id="btnRew" title="后退 1 秒 (←)">⏪</button>
        <button class="icon-btn" id="btnPrevFrame" title="上一帧 (Shift+←)">◀️</button>
        <button class="icon-btn accent" id="btnPlay" title="播放/暂停 (Space)">▶️</button>
        <button class="icon-btn" id="btnNextFrame" title="下一帧 (Shift+→)">▶️</button>
        <button class="icon-btn" id="btnFwd" title="前进 1 秒 (→)">⏩</button>
        <span class="time">
          <span class="current" id="timeCurrent">0:00</span>
          <span> / </span>
          <span id="timeDuration">0:00</span>
        </span>
        <button class="btn accent" id="btnCapture" disabled title="截图 (S)">📸 截图</button>
      </div>
      <!-- row 2: progress -->
      <div class="ctrl-row">
        <div class="progress-bar" id="progressBar">
          <div class="fill" id="progressFill"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Storyboard Panel -->
  <div class="storyboard-panel" id="storyboardPanel">
    <div class="storyboard-header">
      📋 分镜列表
      <span class="hint">拖拽排序 · 点击备注编辑</span>
    </div>
    <div class="storyboard-grid" id="storyboardGrid"></div>
  </div>

</div>

<script>
// ====== State ======
let shots = [];
let shotIdCounter = 0;
let videoLoaded = false;

// ====== DOM refs ======
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

const video       = $('#video');
const dropZone    = $('#dropZone');
const dropOverlay = $('#dropOverlay');
const fileInput   = $('#fileInput');
const btnLoad     = $('#btnLoad');
const btnPlay     = $('#btnPlay');
const btnCapture  = $('#btnCapture');
const btnClear    = $('#btnClear');
const btnExport   = $('#btnExport');
const btnRew      = $('#btnRew');
const btnFwd      = $('#btnFwd');
const btnPrevFrame= $('#btnPrevFrame');
const btnNextFrame= $('#btnNextFrame');
const progressBar = $('#progressBar');
const progressFill= $('#progressFill');
const timeCurrent = $('#timeCurrent');
const timeDuration= $('#timeDuration');
const grid        = $('#storyboardGrid');
const shotCount   = $('#shotCount');
const vidControls = $('#videoControls');

// ====== Format helpers ======
function fmtTime(seconds) {
  if (!isFinite(seconds) || seconds < 0) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

function fmtTimeFull(seconds) {
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  const ms = Math.floor((seconds % 1) * 100);
  return `${m}:${String(s).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
}

// ====== Video Loading ======
function loadVideoFile(file) {
  if (!file || !file.type.startsWith('video/')) {
    alert('请选择有效的视频文件');
    return;
  }
  const url = URL.createObjectURL(file);
  video.src = url;
  video.load();
  video.onloadedmetadata = () => {
    videoLoaded = true;
    dropZone.classList.add('has-video');
    dropZone.classList.remove('empty');
    btnCapture.disabled = false;
    timeDuration.textContent = fmtTime(video.duration);
    updateProgress();
  };
}

fileInput.addEventListener('change', (e) => {
  if (e.target.files[0]) loadVideoFile(e.target.files[0]);
});

// Click dropzone to open file picker
dropZone.addEventListener('click', () => fileInput.click());
btnLoad.addEventListener('click', () => fileInput.click());

// Drag & drop on video zone
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); });
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file) loadVideoFile(file);
});

// Full-window drag overlay
document.addEventListener('dragover', (e) => {
  e.preventDefault();
  if (e.dataTransfer.types.includes('Files')) {
    dropOverlay.classList.add('active');
  }
});
document.addEventListener('dragleave', (e) => {
  if (e.target === document || e.target === document.documentElement) {
    dropOverlay.classList.remove('active');
  }
});
document.addEventListener('drop', (e) => {
  e.preventDefault();
  dropOverlay.classList.remove('active');
  // If dropped outside the video zone, still try to load
  if (!dropZone.contains(e.target) && e.dataTransfer.files[0]) {
    loadVideoFile(e.dataTransfer.files[0]);
  }
});

// ====== Video Controls ======
function togglePlay() {
  if (video.paused) {
    video.play();
    btnPlay.textContent = '⏸️';
  } else {
    video.pause();
    btnPlay.textContent = '▶️';
  }
}

btnPlay.addEventListener('click', togglePlay);
video.addEventListener('click', togglePlay);

video.addEventListener('play', () => { btnPlay.textContent = '⏸️'; });
video.addEventListener('pause', () => { btnPlay.textContent = '▶️'; });
video.addEventListener('ended', () => { btnPlay.textContent = '▶️'; });

video.addEventListener('timeupdate', updateProgress);

function updateProgress() {
  if (!videoLoaded || !video.duration) return;
  const pct = (video.currentTime / video.duration) * 100;
  progressFill.style.width = pct + '%';
  timeCurrent.textContent = fmtTime(video.currentTime);
}

// Progress bar click
progressBar.addEventListener('click', (e) => {
  if (!videoLoaded) return;
  const rect = progressBar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  video.currentTime = pct * video.duration;
});

// Seek buttons
btnRew.addEventListener('click', () => {
  video.currentTime = Math.max(0, video.currentTime - 1);
});
btnFwd.addEventListener('click', () => {
  video.currentTime = Math.min(video.duration, video.currentTime + 1);
});
btnPrevFrame.addEventListener('click', () => {
  // ~30fps frame step
  video.currentTime = Math.max(0, video.currentTime - 1/30);
});
btnNextFrame.addEventListener('click', () => {
  video.currentTime = Math.min(video.duration, video.currentTime + 1/30);
});

// ====== Frame Capture ======
function captureFrame() {
  if (!videoLoaded) return;

  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 360;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  const shot = {
    id: ++shotIdCounter,
    time: video.currentTime,
    img: dataUrl,
    note: '',
  };
  shots.push(shot);
  renderShots();
  // Scroll to bottom
  grid.scrollTop = grid.scrollHeight;
}

btnCapture.addEventListener('click', captureFrame);

// ====== Render Storyboard ======
function renderShots() {
  grid.innerHTML = '';
  shots.forEach((shot, idx) => {
    const card = document.createElement('div');
    card.className = 'shot-card';
    card.draggable = true;
    card.dataset.index = idx;

    card.innerHTML = `
      <div class="thumb-wrap">
        <img src="${shot.img}" alt="Shot ${idx + 1}">
        <span class="shot-num">#${idx + 1}</span>
        <button class="shot-del" data-action="delete" title="删除此镜头">×</button>
      </div>
      <div class="card-info">
        <span class="timecode">⏱ ${fmtTimeFull(shot.time)}</span>
        <textarea class="note-input"
          placeholder="备注…"
          data-action="note"
          data-idx="${idx}"
          rows="1">${escapeHtml(shot.note)}</textarea>
      </div>
    `;

    // Delete button
    card.querySelector('[data-action="delete"]').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteShot(idx);
    });

    // Note edit
    const noteEl = card.querySelector('[data-action="note"]');
    noteEl.addEventListener('input', () => {
      shots[idx].note = noteEl.value;
    });
    // Auto-resize textarea
    noteEl.addEventListener('input', autoResizeTextarea);
    // Init auto-resize
    requestAnimationFrame(() => autoResizeTextarea.call(noteEl));

    // Drag events
    card.addEventListener('dragstart', handleDragStart);
    card.addEventListener('dragend', handleDragEnd);
    card.addEventListener('dragover', handleDragOver);
    card.addEventListener('dragleave', handleDragLeave);
    card.addEventListener('drop', handleDrop);

    // Click card to seek video to that time
    card.querySelector('.thumb-wrap').addEventListener('click', () => {
      if (videoLoaded) {
        video.currentTime = shot.time;
      }
    });

    grid.appendChild(card);
  });

  // Update UI state
  shotCount.textContent = `${shots.length} 个镜头`;
  btnClear.disabled = shots.length === 0;
  btnExport.disabled = shots.length === 0;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function autoResizeTextarea() {
  this.style.height = 'auto';
  this.style.height = this.scrollHeight + 'px';
}

function deleteShot(index) {
  shots.splice(index, 1);
  renderShots();
}

btnClear.addEventListener('click', () => {
  if (shots.length === 0) return;
  if (confirm(`确定要清空全部 ${shots.length} 个分镜吗？`)) {
    shots = [];
    renderShots();
  }
});

// ====== Drag & Drop Reorder ======
let dragSrcIndex = null;

function handleDragStart(e) {
  dragSrcIndex = parseInt(this.dataset.index);
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragSrcIndex);
}

function handleDragEnd(e) {
  this.classList.remove('dragging');
  dragSrcIndex = null;
  $$('.shot-card').forEach(c => c.classList.remove('drag-over'));
}

function handleDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  this.classList.add('drag-over');
}

function handleDragLeave(e) {
  this.classList.remove('drag-over');
}

function handleDrop(e) {
  e.preventDefault();
  this.classList.remove('drag-over');

  const targetIndex = parseInt(this.dataset.index);
  if (dragSrcIndex === null || dragSrcIndex === targetIndex) return;

  // Reorder
  const [moved] = shots.splice(dragSrcIndex, 1);
  shots.splice(targetIndex, 0, moved);
  renderShots();
}

// ====== Export ======
btnExport.addEventListener('click', () => {
  if (shots.length === 0) return;

  // Build a single canvas with all thumbnails stacked vertically
  const thumbWidth = 640;
  const thumbHeight = 360;
  const padding = 20;
  const headerHeight = 50;
  const gap = 10;

  const canvas = document.createElement('canvas');
  canvas.width = thumbWidth + padding * 2;
  canvas.height = shots.length * (thumbHeight + headerHeight + gap) + padding * 2 + gap;
  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let y = padding;

  // Title
  ctx.fillStyle = '#eaeaea';
  ctx.font = 'bold 22px -apple-system, sans-serif';
  ctx.fillText('🎬 视频分镜 Storyboard', padding, y + 30);
  y += 60;

  const loadImage = (src) => {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = src;
    });
  };

  Promise.all(shots.map(s => loadImage(s.img))).then(images => {
    images.forEach((img, i) => {
      const shot = shots[i];

      // Card background
      ctx.fillStyle = '#0f3460';
      roundRect(ctx, padding, y, thumbWidth, thumbHeight + headerHeight, 10);
      ctx.fill();

      // Thumbnail
      if (img) {
        ctx.save();
        // Clip rounded top corners
        ctx.beginPath();
        ctx.moveTo(padding + 10, y);
        ctx.lineTo(padding + thumbWidth - 10, y);
        ctx.quadraticCurveTo(padding + thumbWidth, y, padding + thumbWidth, y + 10);
        ctx.lineTo(padding + thumbWidth, y + thumbHeight);
        ctx.lineTo(padding, y + thumbHeight);
        ctx.lineTo(padding, y + 10);
        ctx.quadraticCurveTo(padding, y, padding + 10, y);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(img, padding, y, thumbWidth, thumbHeight);
        ctx.restore();
      }

      // Number badge
      ctx.fillStyle = '#e94560';
      ctx.font = 'bold 14px -apple-system, sans-serif';
      const numText = `#${i + 1}`;
      const numW = ctx.measureText(numText).width + 14;
      roundRect(ctx, padding + 10, y + 8, numW, 26, 13);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillText(numText, padding + 17, y + 26);

      // Timecode
      ctx.fillStyle = '#e94560';
      ctx.font = 'bold 14px -apple-system, sans-serif';
      ctx.fillText('⏱ ' + fmtTimeFull(shot.time), padding + 12, y + thumbHeight + 28);

      // Note
      if (shot.note) {
        ctx.fillStyle = '#8899aa';
        ctx.font = '13px -apple-system, sans-serif';
        const noteText = truncateText(ctx, shot.note, thumbWidth - 24);
        ctx.fillText(noteText, padding + 12, y + thumbHeight + 48);
      }

      y += thumbHeight + headerHeight + gap;
    });

    // Footer
    ctx.fillStyle = '#555';
    ctx.font = '11px -apple-system, sans-serif';
    ctx.fillText(`共 ${shots.length} 个镜头 · ${new Date().toLocaleString()}`, padding, canvas.height - 15);

    // Download
    const link = document.createElement('a');
    link.download = `storyboard_${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
});

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function truncateText(ctx, text, maxWidth) {
  if (ctx.measureText(text).width <= maxWidth) return text;
  let truncated = text;
  while (ctx.measureText(truncated + '…').width > maxWidth && truncated.length > 0) {
    truncated = truncated.slice(0, -1);
  }
  return truncated + '…';
}

// ====== Keyboard Shortcuts ======
document.addEventListener('keydown', (e) => {
  // Don't trigger shortcuts when typing in textarea
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;

  switch (e.key) {
    case ' ':
      e.preventDefault();
      togglePlay();
      break;
    case 's':
    case 'S':
      e.preventDefault();
      captureFrame();
      break;
    case 'ArrowLeft':
      if (e.shiftKey) {
        e.preventDefault();
        video.currentTime = Math.max(0, video.currentTime - 1/30);
      } else {
        e.preventDefault();
        video.currentTime = Math.max(0, video.currentTime - 1);
      }
      break;
    case 'ArrowRight':
      if (e.shiftKey) {
        e.preventDefault();
        video.currentTime = Math.min(video.duration, video.currentTime + 1/30);
      } else {
        e.preventDefault();
        video.currentTime = Math.min(video.duration, video.currentTime + 1);
      }
      break;
    case 'o':
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        fileInput.click();
      }
      break;
    case 'e':
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        if (shots.length > 0) btnExport.click();
      }
      break;
    case 'Delete':
    case 'Backspace':
      // Delete last shot
      if (shots.length > 0) {
        e.preventDefault();
        deleteShot(shots.length - 1);
      }
      break;
  }
});

// ====== Init ======
// Disable capture until video loads
btnCapture.disabled = true;
</script>
