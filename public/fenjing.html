<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频分镜工具 — Storyboard</title>
<style>
/* ====== CSS Variables & Reset ====== */
:root {
  --bg: #1a1a2e;
  --panel-bg: #16213e;
  --card-bg: #0f3460;
  --accent: #e94560;
  --accent-hover: #ff6b81;
  --text: #eaeaea;
  --text-dim: #8899aa;
  --border: #2a3a5c;
  --radius: 10px;
  --gap: 12px;
  --transition: 0.2s ease;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ====== Toolbar ====== */
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  background: var(--panel-bg);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  flex-wrap: wrap;
}
.toolbar h1 {
  font-size: 1.15rem;
  font-weight: 700;
  margin-right: auto;
  white-space: nowrap;
  letter-spacing: 0.5px;
}
.toolbar h1 span { color: var(--accent); }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--card-bg);
  color: var(--text);
  font-size: 0.875rem;
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
  user-select: none;
}
.btn:hover { background: var(--border); border-color: var(--accent); }
.btn:active { transform: scale(0.97); }
.btn.accent {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}
.btn.accent:hover { background: var(--accent-hover); }
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}

.shot-count {
  font-size: 0.8rem;
  color: var(--text-dim);
  padding: 4px 10px;
  background: var(--bg);
  border-radius: 20px;
}

/* ====== Main Layout ====== */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
  gap: 2px;
  background: var(--border);
}

/* ====== Video Panel ====== */
.video-panel {
  flex: 1 1 50%;
  display: flex;
  flex-direction: column;
  background: var(--panel-bg);
  min-width: 360px;
}

.video-drop-zone {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: #000;
  cursor: pointer;
}
.video-drop-zone.empty::after {
  content: "拖拽视频到此处，或点击选择文件";
  color: var(--text-dim);
  font-size: 1rem;
  pointer-events: none;
  text-align: center;
  padding: 20px;
}
.video-drop-zone video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: none;
}
.video-drop-zone.has-video video { display: block; }
.video-drop-zone.has-video.empty::after { display: none; }

/* ====== Video Controls ====== */
.video-controls {
  padding: 10px 14px;
  background: var(--card-bg);
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ctrl-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.ctrl-row .time {
  font-size: 0.8rem;
  font-variant-numeric: tabular-nums;
  color: var(--text-dim);
  min-width: 100px;
  text-align: center;
}
.ctrl-row .time .current { color: var(--text); font-weight: 600; }

.progress-bar {
  flex: 1;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  cursor: pointer;
  position: relative;
  min-width: 80px;
}
.progress-bar .fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  width: 0%;
  transition: width 0.05s linear;
  pointer-events: none;
}

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  font-size: 1rem;
  cursor: pointer;
  transition: var(--transition);
  flex-shrink: 0;
}
.icon-btn:hover { background: var(--border); border-color: var(--accent); }
.icon-btn:active { transform: scale(0.93); }

/* ====== Storyboard Panel ====== */
.storyboard-panel {
  flex: 1 1 50%;
  display: flex;
  flex-direction: column;
  background: var(--panel-bg);
  min-width: 340px;
}
.storyboard-header {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 0.9rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.storyboard-header .hint {
  font-weight: 400;
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-left: auto;
}
.storyboard-grid {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: var(--gap);
  align-content: start;
}
.storyboard-grid:empty::after {
  content: "点击 📸 截图按钮捕获当前帧\A或按快捷键 Space 暂停后按 S 截图";
  white-space: pre;
  color: var(--text-dim);
  font-size: 0.85rem;
  text-align: center;
  grid-column: 1 / -1;
  padding: 40px 20px;
}

/* ====== Shot Card ====== */
.shot-card {
  background: var(--card-bg);
  border: 2px solid transparent;
  border-radius: var(--radius);
  overflow: hidden;
  cursor: grab;
  transition: var(--transition);
  display: flex;
  flex-direction: column;
}
.shot-card:hover { border-color: var(--accent); }
.shot-card:active { cursor: grabbing; }
.shot-card.dragging { opacity: 0.4; border-color: var(--accent); }
.shot-card.drag-over { border-color: var(--accent-hover); border-style: dashed; }

.shot-card .thumb-wrap {
  position: relative;
  aspect-ratio: 16/9;
  background: #000;
  overflow: hidden;
}
.shot-card .thumb-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.shot-card .shot-num {
  position: absolute;
  top: 6px;
  left: 6px;
  background: var(--accent);
  color: #fff;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
}
.shot-card .shot-del {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 24px; height: 24px;
  border-radius: 50%;
  border: none;
  background: rgba(0,0,0,0.6);
  color: #fff;
  font-size: 0.85rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: var(--transition);
}
.shot-card:hover .shot-del { opacity: 1; }
.shot-card .shot-del:hover { background: var(--accent); }

.shot-card .card-info {
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.shot-card .timecode {
  font-size: 0.7rem;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}
.shot-card .note-input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--bg);
  color: var(--text);
  font-size: 0.78rem;
  padding: 5px 7px;
  resize: none;
  font-family: inherit;
  min-height: 36px;
}
.shot-card .note-input:focus {
  outline: none;
  border-color: var(--accent);
}
.shot-card .note-input::placeholder {
  color: var(--text-dim);
  font-size: 0.7rem;
}

/* ====== Scrollbar ====== */
.storyboard-grid::-webkit-scrollbar { width: 6px; }
.storyboard-grid::-webkit-scrollbar-track { background: transparent; }
.storyboard-grid::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 3px;
}

/* ====== Responsive ====== */
@media (max-width: 768px) {
  .main { flex-direction: column; }
  .video-panel { min-width: 0; flex: 1 1 45%; }
  .storyboard-panel { min-width: 0; flex: 1 1 55%; }
  .storyboard-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
}

/* ====== Drop overlay ====== */
.drop-overlay {
  position: fixed;
  inset: 0;
  background: rgba(233,69,96,0.15);
  border: 4px dashed var(--accent);
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--accent);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
}
.drop-overlay.active { opacity: 1; }

/* ====== Project Modal ====== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }

.modal {
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  width: min(720px, 94vw);
  max-height: 82vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.modal-header h3 { font-size: 1.05rem; }

.modal-close {
  width: 32px; height: 32px;
  border: none; border-radius: 50%;
  background: var(--border);
  color: var(--text);
  font-size: 1.1rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--accent); }

.modal-body {
  flex: 1;
  overflow-y: auto;
  padding: 14px 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
  align-content: start;
}

.project-card {
  background: var(--card-bg);
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.project-card:hover { border-color: var(--accent); }
.project-card.active-project { border-color: var(--accent); box-shadow: 0 0 12px rgba(233,69,96,0.2); }

.project-thumb {
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  border-radius: 6px;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.project-thumb img {
  width: 100%; height: 100%; object-fit: cover;
}
.project-thumb .no-thumb {
  font-size: 1.8rem;
  color: var(--text-dim);
}

.project-name {
  font-size: 0.8rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.project-meta {
  font-size: 0.7rem;
  color: var(--text-dim);
  display: flex; justify-content: space-between;
}
.project-actions {
  display: flex; gap: 5px; margin-top: 2px;
}
.project-actions .btn {
  flex: 1;
  font-size: 0.7rem;
  padding: 4px 6px;
  justify-content: center;
}
.proj-btn-danger { border-color: var(--accent) !important; color: var(--accent) !important; }
.proj-btn-danger:hover { background: var(--accent) !important; color: #fff !important; }

.modal-empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 40px 20px;
  color: var(--text-dim);
}
.modal-empty .icon { font-size: 3rem; margin-bottom: 10px; }

/* Project name in toolbar */
.toolbar .proj-name {
  font-size: 0.8rem;
  color: var(--text-dim);
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin: 0 4px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 5px;
  background: var(--card-bg);
  border: 1px solid transparent;
  transition: var(--transition);
}
.toolbar .proj-name:hover { border-color: var(--border); color: var(--text); }

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--card-bg);
  border: 1px solid var(--accent);
  color: var(--text);
  padding: 10px 22px;
  border-radius: 8px;
  font-size: 0.85rem;
  z-index: 2000;
  opacity: 0;
  transition: all 0.3s ease;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- ====== Drop Overlay ====== -->
<div class="drop-overlay" id="dropOverlay">释放以加载视频</div>

<!-- ====== Project Modal ====== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3>📂 历史项目</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody">
      <div class="modal-empty">
        <div class="icon">📭</div>
        <p>暂无保存的项目</p>
        <p style="font-size:0.75rem;color:var(--text-dim)">截图后会自动创建项目</p>
      </div>
    </div>
  </div>
</div>

<!-- ====== Toast ====== -->
<div class="toast" id="toast"></div>

<!-- ====== Toolbar ====== -->
<div class="toolbar">
  <h1>🎬 <span>分镜</span>工具</h1>
  <span class="proj-name" id="projNameDisplay" title="点击管理项目">未命名项目</span>
  <label class="btn" id="btnLoad" title="选择视频文件 (Ctrl+O)">
    📂 加载视频
    <input type="file" id="fileInput" accept="video/*" hidden>
  </label>
  <button class="btn" id="btnProjects" title="浏览历史项目">📋 项目</button>
  <button class="btn" id="btnNewProject" title="新建空白项目">➕ 新建</button>
  <button class="btn" id="btnClear" disabled title="清空所有分镜">🗑️ 清空</button>
  <button class="btn accent" id="btnExport" disabled title="导出所有分镜为 ZIP 包 (Ctrl+E)">📦 导出 ZIP</button>
  <span class="shot-count" id="shotCount">0 个镜头</span>
</div>

<!-- ====== Main ====== -->
<div class="main">

  <!-- Video Panel -->
  <div class="video-panel" id="videoPanel">
    <div class="video-drop-zone empty" id="dropZone">
      <video id="video" preload="metadata" crossorigin="anonymous"></video>
    </div>
    <div class="video-controls" id="videoControls">
      <!-- row 1: playback -->
      <div class="ctrl-row">
        <button class="icon-btn" id="btnRew" title="后退 1 秒 (←)">⏪</button>
        <button class="icon-btn" id="btnPrevFrame" title="上一帧 (Shift+←)">◀️</button>
        <button class="icon-btn accent" id="btnPlay" title="播放/暂停 (Space)">▶️</button>
        <button class="icon-btn" id="btnNextFrame" title="下一帧 (Shift+→)">▶️</button>
        <button class="icon-btn" id="btnFwd" title="前进 1 秒 (→)">⏩</button>
        <span class="time">
          <span class="current" id="timeCurrent">0:00</span>
          <span> / </span>
          <span id="timeDuration">0:00</span>
        </span>
        <button class="btn accent" id="btnCapture" disabled title="截图 (S)">📸 截图</button>
      </div>
      <!-- row 2: progress -->
      <div class="ctrl-row">
        <div class="progress-bar" id="progressBar">
          <div class="fill" id="progressFill"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Storyboard Panel -->
  <div class="storyboard-panel" id="storyboardPanel">
    <div class="storyboard-header">
      📋 分镜列表
      <span class="hint">拖拽排序 · 点击备注编辑</span>
    </div>
    <div class="storyboard-grid" id="storyboardGrid"></div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
// ====== State ======
let shots = [];
let shotIdCounter = 0;
let videoLoaded = false;
let currentProjectId = null;
let currentProjectName = '未命名项目';
let db = null; // IndexedDB instance
let autoSaveTimer = null;

// ====== DOM refs ======
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

const video         = $('#video');
const dropZone      = $('#dropZone');
const dropOverlay   = $('#dropOverlay');
const fileInput     = $('#fileInput');
const btnLoad       = $('#btnLoad');
const btnPlay       = $('#btnPlay');
const btnCapture    = $('#btnCapture');
const btnClear      = $('#btnClear');
const btnExport     = $('#btnExport');
const btnRew        = $('#btnRew');
const btnFwd        = $('#btnFwd');
const btnPrevFrame  = $('#btnPrevFrame');
const btnNextFrame  = $('#btnNextFrame');
const progressBar   = $('#progressBar');
const progressFill  = $('#progressFill');
const timeCurrent   = $('#timeCurrent');
const timeDuration  = $('#timeDuration');
const grid          = $('#storyboardGrid');
const shotCount     = $('#shotCount');
const vidControls   = $('#videoControls');
const modalOverlay  = $('#modalOverlay');
const modalBody     = $('#modalBody');
const modalClose    = $('#modalClose');
const btnProjects   = $('#btnProjects');
const btnNewProject = $('#btnNewProject');
const projNameDisplay = $('#projNameDisplay');
const toastEl       = $('#toast');

// ====== IndexedDB ======
const DB_NAME = 'fenjing_storyboard';
const DB_VERSION = 1;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('projects')) {
        const projStore = db.createObjectStore('projects', { keyPath: 'id' });
        projStore.createIndex('updatedAt', 'updatedAt', { unique: false });
      }
      if (!db.objectStoreNames.contains('shots')) {
        const shotStore = db.createObjectStore('shots', { keyPath: 'id' });
        shotStore.createIndex('projectId', 'projectId', { unique: false });
        shotStore.createIndex('sortOrder', 'sortOrder', { unique: false });
      }
    };
    req.onsuccess = (e) => {
      db = e.target.result;
      resolve(db);
    };
    req.onerror = () => reject(req.error);
  });
}

function dbPut(storeName, obj) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).put(obj);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function dbGetAll(storeName, indexName, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const store = tx.objectStore(storeName);
    const req = indexName ? store.index(indexName).getAll(key) : store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbDelete(storeName, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function dbClearShots(projectId) {
  const shots = await dbGetAll('shots', 'projectId', projectId);
  const tx = db.transaction('shots', 'readwrite');
  const store = tx.objectStore('shots');
  for (const s of shots) store.delete(s.id);
  return new Promise((resolve, reject) => {
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// ====== Auto-save ======
let videoFileName = '';
let projectCreatedAt = Date.now();

function scheduleAutoSave() {
  if (!currentProjectId) return;
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => persistShots(), 300);
}

async function persistShots() {
  if (!currentProjectId || !db) return;
  try {
    // Delete existing shots for this project, then re-insert all
    await dbClearShots(currentProjectId);
    for (let i = 0; i < shots.length; i++) {
      const s = shots[i];
      await dbPut('shots', {
        id: s.id,
        projectId: currentProjectId,
        time: s.time,
        note: s.note,
        img: s.img,
        sortOrder: i,
      });
    }
    // Update project metadata
    await dbPut('projects', {
      id: currentProjectId,
      name: currentProjectName,
      videoFileName: videoFileName || '',
      shotCount: shots.length,
      thumbnail: shots.length > 0 ? shots[0].img : '',
      createdAt: projectCreatedAt,
      updatedAt: Date.now(),
    });
  } catch (err) {
    console.error('Auto-save failed:', err);
  }
}

function updateProjDisplay() {
  projNameDisplay.textContent = currentProjectName || '未命名项目';
}

// ====== Toast ======
let toastTimer;
function showToast(msg) {
  clearTimeout(toastTimer);
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2500);
}

// ====== Format helpers ======
function fmtTime(seconds) {
  if (!isFinite(seconds) || seconds < 0) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

function fmtTimeFull(seconds) {
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  const ms = Math.floor((seconds % 1) * 100);
  return `${m}:${String(s).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
}

// ====== Video Loading ======
function loadVideoFile(file) {
  if (!file || !file.type.startsWith('video/')) {
    alert('请选择有效的视频文件');
    return;
  }
  videoFileName = file.name;
  // Auto-name project after video file if still default
  if (!currentProjectName || currentProjectName === '未命名项目' || currentProjectName.startsWith('未命名-')) {
    currentProjectName = file.name.replace(/\.[^.]+$/, '');
    updateProjDisplay();
  }
  const url = URL.createObjectURL(file);
  video.src = url;
  video.load();
  video.onloadedmetadata = () => {
    videoLoaded = true;
    dropZone.classList.add('has-video');
    dropZone.classList.remove('empty');
    btnCapture.disabled = false;
    timeDuration.textContent = fmtTime(video.duration);
    updateProgress();
  };
}

fileInput.addEventListener('change', (e) => {
  if (e.target.files[0]) loadVideoFile(e.target.files[0]);
});

// Click dropzone to open file picker
dropZone.addEventListener('click', () => fileInput.click());
btnLoad.addEventListener('click', () => fileInput.click());

// Drag & drop on video zone
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); });
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file) loadVideoFile(file);
});

// Full-window drag overlay
document.addEventListener('dragover', (e) => {
  e.preventDefault();
  if (e.dataTransfer.types.includes('Files')) {
    dropOverlay.classList.add('active');
  }
});
document.addEventListener('dragleave', (e) => {
  if (e.target === document || e.target === document.documentElement) {
    dropOverlay.classList.remove('active');
  }
});
document.addEventListener('drop', (e) => {
  e.preventDefault();
  dropOverlay.classList.remove('active');
  // If dropped outside the video zone, still try to load
  if (!dropZone.contains(e.target) && e.dataTransfer.files[0]) {
    loadVideoFile(e.dataTransfer.files[0]);
  }
});

// ====== Video Controls ======
function togglePlay() {
  if (video.paused) {
    video.play();
    btnPlay.textContent = '⏸️';
  } else {
    video.pause();
    btnPlay.textContent = '▶️';
  }
}

btnPlay.addEventListener('click', togglePlay);
video.addEventListener('click', togglePlay);

video.addEventListener('play', () => { btnPlay.textContent = '⏸️'; });
video.addEventListener('pause', () => { btnPlay.textContent = '▶️'; });
video.addEventListener('ended', () => { btnPlay.textContent = '▶️'; });

video.addEventListener('timeupdate', updateProgress);

function updateProgress() {
  if (!videoLoaded || !video.duration) return;
  const pct = (video.currentTime / video.duration) * 100;
  progressFill.style.width = pct + '%';
  timeCurrent.textContent = fmtTime(video.currentTime);
}

// Progress bar click
progressBar.addEventListener('click', (e) => {
  if (!videoLoaded) return;
  const rect = progressBar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  video.currentTime = pct * video.duration;
});

// Seek buttons
btnRew.addEventListener('click', () => {
  video.currentTime = Math.max(0, video.currentTime - 1);
});
btnFwd.addEventListener('click', () => {
  video.currentTime = Math.min(video.duration, video.currentTime + 1);
});
btnPrevFrame.addEventListener('click', () => {
  // ~30fps frame step
  video.currentTime = Math.max(0, video.currentTime - 1/30);
});
btnNextFrame.addEventListener('click', () => {
  video.currentTime = Math.min(video.duration, video.currentTime + 1/30);
});

// ====== Frame Capture ======
function captureFrame() {
  if (!videoLoaded) return;

  ensureProject();

  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 360;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  const shot = {
    id: Date.now() * 1000 + Math.floor(Math.random() * 1000),
    time: video.currentTime,
    img: dataUrl,
    note: '',
  };
  shots.push(shot);
  renderShots();
  scheduleAutoSave();
  // Scroll to bottom
  grid.scrollTop = grid.scrollHeight;
}

function ensureProject() {
  if (!currentProjectId) {
    currentProjectId = 'proj_' + Date.now();
    projectCreatedAt = Date.now();
    if (!currentProjectName || currentProjectName === '未命名项目') {
      currentProjectName = '未命名-' + new Date().toLocaleDateString('zh-CN');
    }
    updateProjDisplay();
    // Save project metadata immediately (if DB is ready)
    if (db) {
      dbPut('projects', {
        id: currentProjectId,
        name: currentProjectName,
        videoFileName: videoFileName || '',
        shotCount: 0,
        thumbnail: '',
        createdAt: projectCreatedAt,
        updatedAt: Date.now(),
      }).catch(err => console.error('Create project failed:', err));
    }
  }
}

btnCapture.addEventListener('click', captureFrame);

// ====== Render Storyboard ======
function renderShots() {
  grid.innerHTML = '';
  shots.forEach((shot, idx) => {
    const card = document.createElement('div');
    card.className = 'shot-card';
    card.draggable = true;
    card.dataset.index = idx;

    card.innerHTML = `
      <div class="thumb-wrap">
        <img src="${shot.img}" alt="Shot ${idx + 1}">
        <span class="shot-num">#${idx + 1}</span>
        <button class="shot-del" data-action="delete" title="删除此镜头">×</button>
      </div>
      <div class="card-info">
        <span class="timecode">⏱ ${fmtTimeFull(shot.time)}</span>
        <textarea class="note-input"
          placeholder="备注…"
          data-action="note"
          data-idx="${idx}"
          rows="1">${escapeHtml(shot.note)}</textarea>
      </div>
    `;

    // Delete button
    card.querySelector('[data-action="delete"]').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteShot(idx);
    });

    // Note edit
    const noteEl = card.querySelector('[data-action="note"]');
    noteEl.addEventListener('input', () => {
      shots[idx].note = noteEl.value;
      scheduleAutoSave();
    });
    // Auto-resize textarea
    noteEl.addEventListener('input', autoResizeTextarea);
    // Init auto-resize
    requestAnimationFrame(() => autoResizeTextarea.call(noteEl));

    // Drag events
    card.addEventListener('dragstart', handleDragStart);
    card.addEventListener('dragend', handleDragEnd);
    card.addEventListener('dragover', handleDragOver);
    card.addEventListener('dragleave', handleDragLeave);
    card.addEventListener('drop', handleDrop);

    // Click card to seek video to that time
    card.querySelector('.thumb-wrap').addEventListener('click', () => {
      if (videoLoaded) {
        video.currentTime = shot.time;
      }
    });

    grid.appendChild(card);
  });

  // Update UI state
  shotCount.textContent = `${shots.length} 个镜头`;
  btnClear.disabled = shots.length === 0;
  btnExport.disabled = shots.length === 0;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function autoResizeTextarea() {
  this.style.height = 'auto';
  this.style.height = this.scrollHeight + 'px';
}

function deleteShot(index) {
  shots.splice(index, 1);
  renderShots();
  scheduleAutoSave();
}

btnClear.addEventListener('click', async () => {
  if (shots.length === 0) return;
  if (confirm(`确定要清空全部 ${shots.length} 个分镜吗？`)) {
    shots = [];
    renderShots();
    scheduleAutoSave();
    await persistShots(); // immediately save empty state
  }
});

// ====== Drag & Drop Reorder ======
let dragSrcIndex = null;

function handleDragStart(e) {
  dragSrcIndex = parseInt(this.dataset.index);
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragSrcIndex);
}

function handleDragEnd(e) {
  this.classList.remove('dragging');
  dragSrcIndex = null;
  $$('.shot-card').forEach(c => c.classList.remove('drag-over'));
}

function handleDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  this.classList.add('drag-over');
}

function handleDragLeave(e) {
  this.classList.remove('drag-over');
}

function handleDrop(e) {
  e.preventDefault();
  this.classList.remove('drag-over');

  const targetIndex = parseInt(this.dataset.index);
  if (dragSrcIndex === null || dragSrcIndex === targetIndex) return;

  // Reorder
  const [moved] = shots.splice(dragSrcIndex, 1);
  shots.splice(targetIndex, 0, moved);
  renderShots();
  scheduleAutoSave();
}

// ====== Export ======
btnExport.addEventListener('click', async () => {
  if (shots.length === 0) return;

  btnExport.disabled = true;
  btnExport.textContent = '⏳ 打包中...';

  try {
    const zip = new JSZip();
    // Use original video resolution for export, capped at 1920px wide
    const maxW = 1920;
    const origW = video.videoWidth || 640;
    const origH = video.videoHeight || 360;
    const scale = Math.min(1, maxW / origW);
    const expW = Math.round(origW * scale);
    const expH = Math.round(origH * scale);

    const loadImage = (src) => {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    };

    const images = await Promise.all(shots.map(s => loadImage(s.img)));

    for (let i = 0; i < shots.length; i++) {
      const shot = shots[i];
      const img = images[i];
      if (!img) continue;

      // Each shot gets its own canvas with overlay info
      const canvas = document.createElement('canvas');
      canvas.width = expW;
      canvas.height = expH + 56; // extra space for info bar
      const ctx = canvas.getContext('2d');

      // Draw thumbnail (fill width, keep aspect)
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, expW, expH + 56);
      ctx.drawImage(img, 0, 0, expW, expH);

      // Info bar at bottom
      ctx.fillStyle = 'rgba(15, 52, 96, 0.92)';
      ctx.fillRect(0, expH, expW, 56);

      // Shot number
      ctx.fillStyle = '#e94560';
      ctx.font = 'bold 15px -apple-system, sans-serif';
      ctx.fillText(`#${i + 1}`, 12, expH + 22);

      // Timecode
      const tc = fmtTimeFull(shot.time);
      ctx.fillStyle = '#eaeaea';
      ctx.font = 'bold 14px monospace';
      ctx.fillText('⏱ ' + tc, 58, expH + 22);

      // Note (if any)
      if (shot.note) {
        ctx.fillStyle = '#8899aa';
        ctx.font = '12px -apple-system, sans-serif';
        const maxNoteW = expW - 220;
        const noteText = truncateText(ctx, shot.note, maxNoteW);
        ctx.fillText('📝 ' + noteText, 220, expH + 22);
      }

      // File name: shot_01_00-00-05.png
      const pad = (n) => String(n).padStart(2, '0');
      const mm = pad(Math.floor(shot.time / 60));
      const ss = pad(Math.floor(shot.time % 60));
      const ff = pad(Math.floor((shot.time % 1) * 30));
      const filename = `shot_${pad(i + 1)}_${mm}-${ss}-${ff}.png`;

      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      zip.file(filename, blob);
    }

    // Generate zip and download
    const zipBlob = await zip.generateAsync({ type: 'blob' });
    const link = document.createElement('a');
    link.download = `storyboard_${Date.now()}.zip`;
    link.href = URL.createObjectURL(zipBlob);
    link.click();
    URL.revokeObjectURL(link.href);

  } catch (err) {
    console.error('Export failed:', err);
    alert('导出失败: ' + err.message);
  } finally {
    btnExport.disabled = false;
    btnExport.textContent = '📦 导出 ZIP';
  }
});

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function truncateText(ctx, text, maxWidth) {
  if (ctx.measureText(text).width <= maxWidth) return text;
  let truncated = text;
  while (ctx.measureText(truncated + '…').width > maxWidth && truncated.length > 0) {
    truncated = truncated.slice(0, -1);
  }
  return truncated + '…';
}

// ====== Project Management ======
async function createNewProject() {
  // Save current project first if it has shots
  if (currentProjectId && shots.length > 0) {
    await persistShots();
  }

  // Reset to new project
  currentProjectId = null;
  currentProjectName = '未命名项目';
  videoFileName = '';
  projectCreatedAt = Date.now();
  shotIdCounter = 0;
  shots = [];
  renderShots();
  updateProjDisplay();
  showToast('✅ 已创建新项目');
}

async function openProjectModal() {
  modalOverlay.classList.add('open');
  await renderProjectList();
}

function closeProjectModal() {
  modalOverlay.classList.remove('open');
}

modalClose.addEventListener('click', closeProjectModal);
modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) closeProjectModal();
});

btnProjects.addEventListener('click', openProjectModal);
projNameDisplay.addEventListener('click', openProjectModal);
btnNewProject.addEventListener('click', createNewProject);

async function renderProjectList() {
  if (!db) return;

  const projects = await dbGetAll('projects');
  // Sort by updatedAt desc
  projects.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

  if (projects.length === 0) {
    modalBody.innerHTML = `
      <div class="modal-empty">
        <div class="icon">📭</div>
        <p>暂无保存的项目</p>
        <p style="font-size:0.75rem;color:var(--text-dim)">截图后会自动创建项目</p>
      </div>`;
    return;
  }

  modalBody.innerHTML = projects.map(p => {
    const isActive = p.id === currentProjectId;
    const date = new Date(p.updatedAt || p.createdAt).toLocaleDateString('zh-CN');
    const thumbHtml = p.thumbnail
      ? `<img src="${p.thumbnail}" alt="">`
      : `<span class="no-thumb">🎬</span>`;

    return `
      <div class="project-card${isActive ? ' active-project' : ''}" data-proj-id="${p.id}">
        <div class="project-thumb">${thumbHtml}</div>
        <div class="project-name" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</div>
        <div class="project-meta">
          <span>${p.shotCount || 0} 镜头</span>
          <span>${date}</span>
        </div>
        <div class="project-actions">
          <button class="btn" data-action="load" data-proj-id="${p.id}">📂 加载</button>
          <button class="btn proj-btn-danger" data-action="delete" data-proj-id="${p.id}">🗑️</button>
        </div>
      </div>`;
  }).join('');

  // Event delegation for load/delete buttons
  modalBody.querySelectorAll('[data-action="load"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      loadProject(btn.dataset.projId);
    });
  });

  modalBody.querySelectorAll('[data-action="delete"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteProject(btn.dataset.projId);
    });
  });

  // Click card to load
  modalBody.querySelectorAll('.project-card').forEach(card => {
    card.addEventListener('click', () => loadProject(card.dataset.projId));
  });
}

async function loadProject(projectId) {
  if (!db) return;

  // Save current project first
  if (currentProjectId && shots.length > 0) {
    await persistShots();
  }

  // Load project metadata
  const projects = await dbGetAll('projects');
  const proj = projects.find(p => p.id === projectId);
  if (!proj) return;

  currentProjectId = proj.id;
  currentProjectName = proj.name;
  videoFileName = proj.videoFileName || '';
  projectCreatedAt = proj.createdAt || Date.now();

  // Load shots
  const shotData = await dbGetAll('shots', 'projectId', projectId);
  shotData.sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));

  shots = shotData.map(s => ({
    id: s.id,
    time: s.time,
    img: s.img,
    note: s.note || '',
  }));

  renderShots();
  updateProjDisplay();
  closeProjectModal();

  showToast(`📂 已加载「${currentProjectName}」· ${shots.length} 个镜头 · 请重新打开视频文件`);
}

async function deleteProject(projectId) {
  if (!db) return;
  if (!confirm('确定要删除此项目及其所有分镜吗？此操作不可恢复。')) return;

  await dbClearShots(projectId);
  await dbDelete('projects', projectId);

  if (projectId === currentProjectId) {
    // Deleted current project — reset
    currentProjectId = null;
    currentProjectName = '未命名项目';
    videoFileName = '';
    projectCreatedAt = Date.now();
    shots = [];
    renderShots();
    updateProjDisplay();
  }

  await renderProjectList();
  showToast('🗑️ 项目已删除');
}

// ====== Keyboard Shortcuts ======
document.addEventListener('keydown', (e) => {
  // Don't trigger shortcuts when typing in textarea
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;

  switch (e.key) {
    case ' ':
      e.preventDefault();
      togglePlay();
      break;
    case 's':
    case 'S':
      e.preventDefault();
      captureFrame();
      break;
    case 'ArrowLeft':
      if (e.shiftKey) {
        e.preventDefault();
        video.currentTime = Math.max(0, video.currentTime - 1/30);
      } else {
        e.preventDefault();
        video.currentTime = Math.max(0, video.currentTime - 1);
      }
      break;
    case 'ArrowRight':
      if (e.shiftKey) {
        e.preventDefault();
        video.currentTime = Math.min(video.duration, video.currentTime + 1/30);
      } else {
        e.preventDefault();
        video.currentTime = Math.min(video.duration, video.currentTime + 1);
      }
      break;
    case 'o':
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        fileInput.click();
      }
      break;
    case 'e':
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        if (shots.length > 0) btnExport.click();
      }
      break;
    case 'Delete':
    case 'Backspace':
      // Delete last shot
      if (shots.length > 0) {
        e.preventDefault();
        deleteShot(shots.length - 1);
      }
      break;
  }
});

// ====== Init ======
async function init() {
  try {
    await openDB();
    console.log('IndexedDB ready');
  } catch (err) {
    console.error('IndexedDB init failed:', err);
  }
  // Always start with a blank workspace (new project is created on first capture)
  updateProjDisplay();
  btnCapture.disabled = true;
}

init();
</script>
